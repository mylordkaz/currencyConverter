      <stop offset="0" stop-color="#1c2434"/><stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.14" r="0.95">
      <stop offset="0" stop-color="#3d7bff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#3d7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="150" y1="150" x2="362" y2="362">
      <stop offset="0" stop-color="#82abff"/><stop offset="1" stop-color="#3d7bff"/>
